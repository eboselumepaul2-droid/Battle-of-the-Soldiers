
name: Build Battle of the Soldiers Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install Godot and Android templates
        run: |
          GODOT_VERSION="4.3-stable"
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q "Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          sudo mv Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q "Godot_v${GODOT_VERSION}_export_templates.tpz" -d /tmp/godot-templates
          mv /tmp/godot-templates/templates ~/.local/share/godot/export_templates/${GODOT_VERSION}

      - name: Install Android build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk android-sdk
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV

      - name: Export Android APK
        run: |
          mkdir -p build
          godot --headless --path . --editor --quit
          godot --headless --path . --export-debug "Android" build/battle-of-the-soldiers.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: battle-of-the-soldiers-android-apk
          path: build/battle-of-the-soldiers.apk
